server {
    listen 80;
    server_name _;

    # Increase client body size for plugin uploads
    client_max_body_size 50M;

    # Console API endpoints
    location /console/api {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # Main API endpoints
    location /api {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # Workflow collaboration WebSocket endpoint. This remains compatible with
    # the classic API and is ready for a future dedicated websocket service.
    location /socket.io/ {
      proxy_pass http://api:5001;
      include proxy.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # Service API v1 endpoints
    location /v1 {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # OpenAPI and difyctl endpoints
    location /openapi {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # File serving endpoints
    location /files {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # Plugin endpoint routing (required for Dify 1.x plugin system)
    # Routes to plugin daemon as per official Dify nginx config
    location /e/ {
      proxy_pass http://plugindaemon:5002;
      proxy_set_header Dify-Hook-Url $scheme://$host$request_uri;
      include proxy.conf;
    }

    # Explore page - explicitly route to web
    location /explore {
      proxy_pass http://web:3000;
      include proxy.conf;
    }

    # MCP endpoints
    location /mcp {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # Triggers endpoints
    location /triggers {
      proxy_pass http://api:5001;
      include proxy.conf;
    }

    # Default - Web frontend (handles /plugins, /apps, /tools, etc.)
    location / {
      proxy_pass http://web:3000;
      include proxy.conf;
    }

    # If you want to support HTTPS, please uncomment the code snippet below
    #listen 443 ssl;
    #ssl_certificate ./../ssl/your_cert_file.cer;
    #ssl_certificate_key ./../ssl/your_cert_key.key;
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    #ssl_prefer_server_ciphers on;
    #ssl_session_cache shared:SSL:10m;
    #ssl_session_timeout 10m;
}
